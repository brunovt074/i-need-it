ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "androidJunit5" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "macrobenchmark" }
